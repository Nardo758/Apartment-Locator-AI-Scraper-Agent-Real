name: Secret Scan & Security Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          head: HEAD
          extra_args: --only-verified

      - name: Check for large files
        run: |
          # Check for files over 1MB that shouldn't be in repo
          find . -type f -size +1M -not -path "./.git/*" -not -path "./node_modules/*" -not -path "./.venv/*" | while read file; do
            echo "⚠️ Large file detected: $file"
          done

      - name: Validate .gitignore patterns
        run: |
          # Check if common generated files are properly ignored
          if git ls-files --others --exclude-from=.gitignore | grep -E '\.(json|png|html|log)$'; then
            echo "❌ Generated files detected that should be in .gitignore"
            exit 1
          fi
