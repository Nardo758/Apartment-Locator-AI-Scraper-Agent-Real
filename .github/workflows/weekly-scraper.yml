name: Weekly Scraper Scheduler

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      region:
        description: 'Target region for scraping'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - atlanta
          - austin
          - dallas
          - houston
      force_run:
        description: 'Force run even if cost limits exceeded'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Perform dry run without actual scraping'
        required: false
        default: false
        type: boolean

env: {}

jobs:
  pre-flight-checks:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.cost_check.outputs.should_run }}
      estimated_cost: ${{ steps.cost_check.outputs.estimated_cost }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: '2.x'

    - name: Check cost limits
      id: cost_check
      run: |
        echo "Checking daily cost limits..."

        # Read cost control configuration
        if [ -f "deploy-control.json" ]; then
          DAILY_LIMIT=$(cat deploy-control.json | grep -o '"cost_limit_daily":[^,}]*' | cut -d':' -f2 | tr -d ' ",' || echo "50")
        else
          DAILY_LIMIT=50
        fi

        echo "Daily cost limit: $DAILY_LIMIT"

        # Estimate current usage (this would typically call your cost tracking API)
        ESTIMATED_COST=25  # Placeholder - replace with actual cost check

        echo "estimated_cost=$ESTIMATED_COST" >> $GITHUB_OUTPUT

        if [ "${{ inputs.force_run }}" == "true" ]; then
          echo "Force run enabled, bypassing cost checks"
          echo "should_run=true" >> $GITHUB_OUTPUT
        elif [ "$ESTIMATED_COST" -lt "$DAILY_LIMIT" ]; then
          echo "Cost check passed: $ESTIMATED_COST < $DAILY_LIMIT"
          echo "should_run=true" >> $GITHUB_OUTPUT
        else
          echo "Cost limit exceeded: $ESTIMATED_COST >= $DAILY_LIMIT"
          echo "should_run=false" >> $GITHUB_OUTPUT
        fi

    - name: Check system health
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: |
        echo "Checking system health..."

        # Check Supabase connectivity
        if curl -f -s "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_ANON_KEY" > /dev/null; then
          echo "✅ Supabase connection healthy"
        else
          echo "❌ Supabase connection failed"
          exit 1
        fi

        echo "✅ System health checks passed"

  populate-queue:
    name: Populate Scraping Queue
    runs-on: ubuntu-latest
    needs: pre-flight-checks
    if: needs.pre-flight-checks.outputs.should_run == 'true'

    strategy:
      matrix:
        region: [atlanta, austin, dallas, houston]
      fail-fast: false
      max-parallel: 2

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js (for populate script)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Node dependencies
      run: |
        npm ci

    - name: Populate queue for ${{ matrix.region }} (node script)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        REGION: ${{ matrix.region }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        echo "🚀 Populating scraping queue for region: $REGION"

        if [ "$DRY_RUN" == "true" ]; then
          echo "🧪 Running in dry-run mode"
        fi

        node scripts/populate_queue.js "$REGION" "$DRY_RUN"

    - name: Generate region report
      if: always()
      run: |
        echo "📊 Generating report for ${{ matrix.region }}..."

        # Create a simple report
        cat > region_report_${{ matrix.region }}.json << EOF
        {
          "region": "${{ matrix.region }}",
          "timestamp": "$(date -u -Iseconds)",
          "status": "${{ job.status }}",
          "dry_run": "${{ inputs.dry_run }}",
          "estimated_cost": "${{ needs.pre-flight-checks.outputs.estimated_cost }}",
          "queue_populated": ${{ job.status == 'success' && 'true' || 'false' }}
        }
        EOF

    - name: Upload region report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scraper-reports
        path: region_report_*.json
        retention-days: 30

  trigger-processing:
    name: Trigger Queue Processing
    runs-on: ubuntu-latest
    needs: [pre-flight-checks, populate-queue]
    if: needs.pre-flight-checks.outputs.should_run == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Trigger batch processing
      run: |
        # Skip processing if this is a dry run (manual trigger only)
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
          echo "🧪 Dry run mode - skipping actual processing"
          exit 0
        fi

        echo "🔄 Triggering batch processing for queued jobs..."

  # Call command-center to start processing the queue
          RESPONSE=$(curl -s -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/command-center" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"action\": \"start_batch\",
            \"batch_size\": 50,
            \"regions\": [\"atlanta\", \"austin\", \"dallas\", \"houston\"]
          }")

        # Check if batch processing started
        if echo "$RESPONSE" | grep -q '"status":"batch_started"'; then
          echo "✅ Batch processing started successfully"
          echo "Response: $RESPONSE"
        else
          echo "❌ Failed to start batch processing"
          echo "Response: $RESPONSE"
          exit 1
        fi

  post-processing:
    name: Post-Processing & Reporting
    runs-on: ubuntu-latest
    needs: [pre-flight-checks, populate-queue, trigger-processing]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download reports
      uses: actions/download-artifact@v4
      with:
        name: scraper-reports
        path: ./reports/
      continue-on-error: true

    - name: Generate summary report
      run: |
        echo "📋 Generating summary report..."

        # Count successful and failed regions
        SUCCESS_COUNT=0
        FAILED_COUNT=0
        TOTAL_PROPERTIES=0

        # Check if reports directory exists
        if [ -d "./reports" ] && [ "$(ls -A ./reports 2>/dev/null)" ]; then
          echo "Found reports directory with files"
          for report in ./reports/region_report_*.json; do
            if [ -f "$report" ]; then
              echo "Processing report: $report"
              REGION=$(cat "$report" | grep -o '"region":"[^"]*' | cut -d'"' -f4 2>/dev/null || echo "unknown")
              STATUS=$(cat "$report" | grep -o '"status":"[^"]*' | cut -d'"' -f4 2>/dev/null || echo "unknown")

              if [ "$STATUS" == "success" ]; then
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              else
                FAILED_COUNT=$((FAILED_COUNT + 1))
              fi
            fi
          done
        else
          echo "⚠️ No reports found - queue population may have failed early"
          # Check job outcomes from the workflow context
          FAILED_COUNT=1
        fi

        echo "SUCCESS_COUNT=$SUCCESS_COUNT" >> $GITHUB_ENV
        echo "FAILED_COUNT=$FAILED_COUNT" >> $GITHUB_ENV
        echo "TOTAL_REGIONS=$((SUCCESS_COUNT + FAILED_COUNT))" >> $GITHUB_ENV

    - name: Send Slack notification
      if: always()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        if [ "${{ needs.pre-flight-checks.outputs.should_run }}" == "false" ]; then
          MESSAGE="⏸️ Weekly scraper skipped due to cost limits\nEstimated cost: \$\${{ needs.pre-flight-checks.outputs.estimated_cost }}"
        elif [ "${{ inputs.dry_run }}" == "true" ]; then
          MESSAGE="🧪 Weekly scraper dry run completed\nRegions processed: $TOTAL_REGIONS\nSuccessful: $SUCCESS_COUNT\nFailed: $FAILED_COUNT"
        elif [ "$TOTAL_REGIONS" -eq "0" ]; then
          MESSAGE="⚠️ Weekly scraper encountered issues\nNo region reports generated\nCheck workflow logs for details"
        else
          MESSAGE="🏠 Weekly scraper queue populated!\nRegions processed: $TOTAL_REGIONS\nSuccessful: $SUCCESS_COUNT\nFailed: $FAILED_COUNT\nEstimated cost: \$\${{ needs.pre-flight-checks.outputs.estimated_cost }}"
        fi

        if [ -n "$SLACK_WEBHOOK_URL" ]; then
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MESSAGE\"}" \
            "$SLACK_WEBHOOK_URL"
        else
          echo "Slack notification: $MESSAGE"
        fi

    - name: Update deployment status
      run: |
        echo "📈 Weekly scraper summary:"
        echo "- Total regions: $TOTAL_REGIONS"
        echo "- Successful: $SUCCESS_COUNT"
        echo "- Failed: $FAILED_COUNT"
        echo "- Estimated cost: ${{ needs.pre-flight-checks.outputs.estimated_cost }}"
        echo "- Dry run: ${{ inputs.dry_run }}"

        if [ "$FAILED_COUNT" -gt 0 ]; then
          echo "⚠️  Some regions failed - check logs for details"
        else
          echo "✅ All regions completed successfully!"
        fi